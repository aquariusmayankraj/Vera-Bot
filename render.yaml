# COST NOTICE: this selects paid compute plus a persistent disk.
# Review the provider's current charges before creating the service.
services:
  - type: web
    name: vera-challenge-bot
    runtime: docker
    plan: 0.5c-512mb
    region: singapore
    numInstances: 1
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /v1/healthz
    autoDeployTrigger: "off"
    disk:
      name: vera-state
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: DB_PATH
        value: /app/data/vera.sqlite3
      - key: TEAM_NAME
        sync: false
      - key: TEAM_MEMBERS
        sync: false
      - key: CONTACT_EMAIL
        sync: false
      - key: STATE_TTL_HOURS
        value: "24"
      - key: DOCS_ENABLED
        value: "true"
