# Manual Render Blueprint import is optional. No resources are created by this file alone.
# Free is for demos: cold starts and local data loss can affect challenge evaluation.
services:
  - type: web
    name: vera-studio-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python start.py
    healthCheckPath: /v1/healthz
    autoDeployTrigger: "off"
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: DB_PATH
        value: data/vera.sqlite3
      - key: CORS_ORIGINS
        value: "*"
      - key: DEMO_ENABLED
        value: "true"
      - key: DOCS_ENABLED
        value: "true"
      - key: TEAM_NAME
        sync: false
      - key: TEAM_MEMBERS
        sync: false
      - key: CONTACT_EMAIL
        sync: false
      - key: FRONTEND_URL
        sync: false
